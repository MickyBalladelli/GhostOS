[[public_api]]
name = "Vm::{new,with_config,run_for_steps,reset,snapshot,restore_snapshot}"
source = "src/lib.rs"
tests = ["vm.foundation.deterministic-fixtures", "vm.foundation.cleanup-golden"]

[[public_api]]
name = "VmCluster::{add_node,run_node,send,advance,receive,inject_fault}"
source = "src/cluster.rs"
tests = ["vm.cluster.deterministic-harness"]

[[public_api]]
name = "Vm::{new,with_config,run_for_steps,run_with_monitor,request_shutdown,request_reboot}"
source = "src/lib.rs"
tests = ["vm.config.bounded-boot-and-power-lifecycle"]

[[public_api]]
name = "run_synos_integration"
source = "src/integration.rs"
tests = ["vm.synos.minimal-boot-services-and-synfs"]

[[public_api]]
name = "Cpu::{new,reset,decode_instruction,step}"
source = "src/cpu/mod.rs"
tests = ["vm.foundation.deterministic-fixtures"]

[[public_api]]
name = "translate_input_bytes"
source = "src/terminal.rs"
tests = ["vm.terminal.translation-ps2-fallback"]

[[public_api]]
name = "LoopbackHub::{set_link_up,queued_packets,clear}"
source = "src/net/backend.rs"
tests = ["vm.network.loopback-routing-isolation-faults"]

[[public_api]]
name = "Mmu::{new,alloc_frame,map_page,read_byte,write_byte}"
source = "src/memory/mod.rs"
tests = ["vm.foundation.deterministic-fixtures"]

[[public_api]]
name = "Device::{read,write,reset} and PortDevice::{read,write,reset}"
source = "src/devices/mod.rs"
tests = ["vm.foundation.fault-device", "vm.foundation.serial-boundary"]

[[public_api]]
name = "DiskImage::{open,read_sector,write_sector,flush,close}"
source = "src/devices/storage/disk_image.rs"
tests = ["vm.foundation.deterministic-fixtures", "vm.foundation.fault-device"]

[[public_api]]
name = "Loader::{load_kernel,load_to_memory,install_boot_parameters,handoff}"
source = "src/boot/mod.rs"
tests = ["vm.foundation.cleanup-golden"]

[[public_api]]
name = "TerminalSession::{new,poll,flush_output}"
source = "src/terminal.rs"
tests = ["vm.foundation.deterministic-fixtures", "vm.foundation.cleanup-golden"]

[[public_api]]
name = "VmSnapshot::{capture,to_bytes,from_bytes,restore_into}"
source = "src/snapshot.rs"
tests = ["vm.foundation.cleanup-golden"]

[[public_api]]
name = "run_synos_integration"
source = "src/integration.rs"
tests = ["vm.foundation.deterministic-fixtures"]

[[public_api]]
name = "NetBackend and PacketQueue"
source = "src/net/mod.rs"
tests = ["vm.foundation.deterministic-fixtures"]
