# Stable VM test inventory. Test IDs are evidence names, not Rust symbols.
schema = 1
crate = "synos-vm"

[[tier]]
name = "fast-unit"
command = "cargo test -p synos-vm --lib --test foundation_59_1 --test matrix_59_11 --test cpu_memory_execution --test snapshot_terminal_network_10_5"
status = "deterministic"

[[tier]]
name = "vm-integration"
command = "cargo test -p synos-vm --test matrix_59_11 --test firmware_boot_synos_10_4"
status = "deterministic"

[[tier]]
name = "cli"
command = "cargo test -p synos-vm --bin synos-vm"
status = "deterministic"

[[tier]]
name = "qemu"
command = "SYNOS_RUN_QEMU_TESTS=1 cargo test -p synos-vm --test qemu_matrix_59_11 -- --ignored"
status = "opt-in"

[[tier]]
name = "cluster"
command = "scripts/qemu-cluster-validation.sh"
status = "opt-in"

[[tier]]
name = "performance"
command = "cargo test -p synos-vm --test test_environments storage_io_performance_and_integrity"
status = "deterministic"

[[tier]]
name = "hardware-accelerated"
command = "SYNOS_QEMU_ACCEL=kvm cargo test -p synos-vm --test qemu_matrix_59_11 -- --ignored"
status = "opt-in"

[[test]]
id = "vm.foundation.deterministic-fixtures"
file = "tests/foundation_59_1.rs"
tiers = ["fast-unit", "vm-integration"]

