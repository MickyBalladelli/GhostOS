# VM behavior inventory. Test IDs resolve to executed evidence records.
schema = 1
crate = "synos-vm"

[evidence]
record_schema = 1
path = "build/test-evidence/{run-id}/{tier}/{test-id}/evidence.json"
required_fields = ["command", "revision", "host", "firmware", "cpu_count", "image_digest", "result_state", "reason"]
result_states = ["passed", "failed", "skipped"]

[[tier]]
name = "fast-unit"
command = "cargo test -p synos-vm --lib --test foundation_59_1 --test matrix_59_11 --test cpu_memory_execution --test cpu_differential --test snapshot_terminal_network_10_5 --test terminal_cleanup --test negative_matrix --test network_integration"
status = "deterministic"

[[tier]]
name = "vm-integration"
command = "cargo test -p synos-vm --test matrix_59_11 --test firmware_boot_synos_10_4 --test network_integration"
status = "deterministic"

[[tier]]
name = "cli"
command = "cargo test -p synos-vm --bin synos-vm"
status = "deterministic"

[[tier]]
name = "qemu"
command = "SYNOS_RUN_QEMU_TESTS=1 cargo test -p synos-vm --test qemu_matrix_59_11 --test test_environments -- --ignored"
status = "opt-in"

[[tier]]
name = "cluster"
command = "scripts/qemu-cluster-validation.sh"
status = "opt-in"

[[tier]]
name = "performance"
command = "cargo bench -p synos-vm --bench bounded"
status = "deterministic"

[[tier]]
name = "hardware-accelerated"
command = "SYNOS_QEMU_ACCEL=kvm cargo test -p synos-vm --test qemu_matrix_59_11 -- --ignored"
status = "opt-in"

[[tier]]
name = "soak"
command = "SYNOS_SOAK_RUNS=3 ./scripts/soak.sh"
status = "opt-in"

[[tier]]
name = "fuzz"
command = "./scripts/fuzz-smoke.sh"
status = "opt-in"

