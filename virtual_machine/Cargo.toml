[package]
name = "synos-vm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A lightweight virtual machine for testing SynOS"

[dependencies]
bitflags = "2.4"
thiserror = "1.0"
synos-abi = { path = "../crates/abi" }
synos-boot-protocol = { path = "../crates/boot-protocol" }
synos-fabric = { path = "../crates/fabric" }
synos-kernel = { path = "../kernel" }
synos-observability = { path = "../crates/observability" }
synos-synfs = { path = "../crates/synfs" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
synos-app = { path = "../crates/app" }
synos-ipc = { path = "../crates/ipc" }
synos-netd = { path = "../crates/netd" }
synos-init = { path = "../crates/init" }
synos-pkg = { path = "../crates/pkg" }
synos-runtime = { path = "../crates/runtime" }
synos-status = { path = "../crates/status" }
synos-test-support = { path = "../crates/test-support" }
synos-webterm = { path = "../crates/synos-webterm" }

[features]
default = []
softmmu = []

[[bench]]
name = "bounded"
harness = false
