[package]
name = "ghostos-vm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A lightweight virtual machine for testing GhostOS"

[dependencies]
bitflags = "2.4"
ghostos-api-compat = { path = "../crates/api-compat" }
thiserror = "1.0"
ghostos-abi = { path = "../crates/abi" }
ghostos-boot-protocol = { path = "../crates/boot-protocol" }
ghostos-fabric = { path = "../crates/fabric" }
ghostos-kernel = { path = "../kernel" }
ghostos-observability = { path = "../crates/observability" }
ghostos-ghostfs = { path = "../crates/ghostfs" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ghostos-app = { path = "../crates/app" }
ghostos-ipc = { path = "../crates/ipc" }
ghostos-netd = { path = "../crates/netd" }
ghostos-init = { path = "../crates/init" }
ghostos-pkg = { path = "../crates/pkg" }
ghostos-runtime = { path = "../crates/runtime" }
ghostos-status = { path = "../crates/status" }
ghostos-test-support = { path = "../crates/test-support" }
ghostos-webterm = { path = "../crates/ghostos-webterm" }

[features]
default = []
softmmu = []

[[bench]]
name = "bounded"
harness = false
