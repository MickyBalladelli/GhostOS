[package]
name = "synos-vm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A lightweight virtual machine for testing SynOS"

[dependencies]
bitflags = "2.4"
thiserror = "1.0"
synos-boot-protocol = { path = "../crates/boot-protocol" }
synos-fabric = { path = "../crates/fabric" }
synos-kernel = { path = "../kernel" }
synos-synfs = { path = "../crates/synfs" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
synos-test-support = { path = "../crates/test-support" }

[features]
default = []
softmmu = []
