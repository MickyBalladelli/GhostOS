[workspace]
resolver = "3"
members = [
    "crates/boot-protocol",
    "crates/host-filesystems",
    "crates/legacy-pc-drivers",
    "crates/platform-io",
    "crates/ipc",
    "crates/runtime",
    "crates/posix-compat",
    "crates/status",
    "crates/observability",
    "crates/synfs",
    "crates/synos-backup",
    "crates/logd",
    "crates/fabric",
    "crates/llm-runtime",
    "crates/compute",
    "crates/syn-shell",
    "crates/system-model",
    "crates/auth",
    "crates/netd",
    "crates/init",
    "crates/pkg",
    "crates/power",
    "crates/synos-top",
    "crates/client-sdk",
    "tools/cargo-synos",
    "kernel",
    "boot/uefi",
]
default-members = [
    "crates/boot-protocol",
    "crates/host-filesystems",
    "crates/legacy-pc-drivers",
    "crates/platform-io",
    "crates/ipc",
    "crates/runtime",
    "crates/posix-compat",
    "crates/status",
    "crates/observability",
    "crates/synfs",
    "crates/synos-backup",
    "crates/logd",
    "crates/fabric",
    "crates/llm-runtime",
    "crates/compute",
    "crates/syn-shell",
    "crates/system-model",
    "crates/auth",
    "crates/netd",
    "crates/init",
    "crates/pkg",
    "crates/power",
    "crates/synos-top",
    "crates/client-sdk",
    "kernel",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
