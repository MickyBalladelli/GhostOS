[package]
name = "synos-embedded-script"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Capability-scoped Rhai automation runtime for SynOS"

[lib]
path = "src/lib.rs"

[dependencies]
rhai = { version = "1.25.1", default-features = false, features = ["no_std", "no_float", "only_i64"] }
synos-status = { path = "../status" }
