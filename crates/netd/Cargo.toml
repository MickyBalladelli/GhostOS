[package]
name = "synos-netd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
smoltcp = { version = "0.13.1", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "auto-icmp-echo-reply",
] }
synos-auth = { path = "../auth" }
synos-fabric = { path = "../fabric" }
synos-ipc = { path = "../ipc" }
synos-kernel = { path = "../../kernel" }
synos-observability = { path = "../observability" }
synos-numa = { path = "../numa" }
synos-policy = { path = "../policy" }
synos-synfs = { path = "../synfs" }
synos-status = { path = "../status" }
synos-time-sync = { path = "../time-sync" }
