[package]
name = "ghostos-netd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
smoltcp = { version = "0.13.1", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "auto-icmp-echo-reply",
] }
ghostos-auth = { path = "../auth" }
ghostos-fabric = { path = "../fabric" }
ghostos-ipc = { path = "../ipc" }
ghostos-kernel = { path = "../../kernel" }
ghostos-observability = { path = "../observability" }
ghostos-numa = { path = "../numa" }
ghostos-policy = { path = "../policy" }
ghostos-ghostfs = { path = "../ghostfs" }
ghostos-status = { path = "../status" }
ghostos-time-sync = { path = "../time-sync" }
