[package]
name = "synos-wasm-script"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Zero-trust capability-scoped WebAssembly runtime for SynOS"

[lib]
path = "src/lib.rs"

[dependencies]
synos-status = { path = "../status" }
wasmi = { version = "1.1.0", default-features = false, features = ["extra-checks", "prefer-btree-collections"] }
