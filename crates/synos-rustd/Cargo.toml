[package]
name = "synos-rustd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bounded compiler-service protocol for SynOS"

[[bin]]
name = "synos-rustd"
path = "src/main.rs"

[dependencies]
synos-init = { path = "../init" }
synos-observability = { path = "../observability" }
synos-pkg = { path = "../pkg" }
synos-runtime = { path = "../runtime" }
synos-synfs = { path = "../synfs" }
synos-status = { path = "../status" }
synos-system-model = { path = "../system-model" }
synos-time-sync = { path = "../time-sync" }
synos-update = { path = "../synos-update" }
synos-service-scale = { path = "../service-scale" }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("synos"))'] }
