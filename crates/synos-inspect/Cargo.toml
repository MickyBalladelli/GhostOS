[package]
name = "synos-inspect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Capability-scoped system inspection and diagnostics for SynOS"

[lib]
path = "src/lib.rs"

[dependencies]
synos-admission = { path = "../admission" }
synos-heal = { path = "../synos-heal" }
syn-shell = { path = "../syn-shell" }
synos-audit = { package = "synos-auditd", path = "../synos-audit" }
synos-fabric = { path = "../fabric" }
synos-observability = { path = "../observability" }
synos-system-model = { path = "../system-model" }
synos-status = { path = "../status" }
synos-synfs = { path = "../synfs" }
synos-update = { path = "../synos-update" }
