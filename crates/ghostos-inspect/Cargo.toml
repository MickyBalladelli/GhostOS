[package]
name = "ghostos-inspect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Capability-scoped system inspection and diagnostics for GhostOS"

[lib]
path = "src/lib.rs"

[dependencies]
ghostos-admission = { path = "../admission" }
ghostos-heal = { path = "../ghostos-heal" }
ghostos-shell = { path = "../ghostos-shell" }
ghostos-audit = { package = "ghostos-auditd", path = "../ghostos-audit" }
ghostos-fabric = { path = "../fabric" }
ghostos-observability = { path = "../observability" }
ghostos-system-model = { path = "../system-model" }
ghostos-status = { path = "../status" }
ghostos-ghostfs = { path = "../ghostfs" }
ghostos-update = { path = "../ghostos-update" }
