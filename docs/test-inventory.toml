# Machine-readable coverage map for the numbered feature sections in TODO.md.
# The IDs are stable names for required evidence, not claims that every test
# already exists. `planned` entries are coverage debt until an artifact is
# produced with the result states documented in docs/testing.md.

schema = 1
source = "TODO.md"
source_scope = "numbered feature sections 1 through 58"
duplicate_source_headings = ["37", "38", "39"]
duplicate_source_policy = "one inventory entry per roadmap number; duplicate TODO headings share the entry"
evidence_root = "build/test-evidence/{run-id}/{tier}/{test-id}"
test_id_format = "{tier}.{feature-id}.{behavior}"
coverage_state = "enforced"
definition_of_done = "docs/test-coverage.toml"

[contract]
required_tiers = ["unit", "integration", "qemu", "fault", "fuzz", "performance"]
required_checklist = [
  "parser-api-success",
  "invalid-input-status",
  "authorization-isolation",
  "limits-cancellation-timeout",
  "persistence-restart-recovery",
  "observability-audit",
  "compatibility-versioning",
  "inventory-evidence",
]
unexecuted_states = ["skipped", "blocked", "not_implemented"]

[tiers.unit]
command = "cargo test"
artifact = "stdout.log"

[gates]
deterministic = "./scripts/test-all.sh"
full_validation = "SYNOS_FULL_VALIDATION=1 ./scripts/full-validation.sh"
release = "./scripts/release-gate.sh build/test-evidence/<run-id>"
coverage_policy = "coverage.toml"
mutation_scope = "status, auth, fsd, synfs, http, virtual_machine"
fuzz_targets = ["path", "volume", "operations", "mount", "http", "script"]

[tiers.integration]
command = "cargo test --workspace --all-targets"
artifact = "stdout.log"

[tiers.qemu]
command = "SYNOS_RUN_QEMU_TESTS=1 cargo test -p synos-vm --test test_environments -- --ignored"
artifact = "serial.log"

[tiers.fault]
command = "cargo test --workspace --all-targets"
artifact = "failure.json"

[tiers.fuzz]
command = "cargo fuzz run <target>"
artifact = "corpus-or-crash"

[tiers.performance]
command = "feature-specific benchmark command"
artifact = "result.json"

