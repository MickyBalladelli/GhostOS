# The enforceable checklist for TODO.md section 59.13.
#
# This file describes evidence, not a claim that an opt-in tier was run.
# A checked feature becomes passed only when every required mapping has a
# per-test evidence artifact with the required execution metadata.

schema = 1
source = "todo/TODO-first.md"
section = "59.13"

[policy]
required_feature_evidence = ["unit", "boundary", "integration", "end_to_end"]
boundary_tier = "integration"
end_to_end_tier = "qemu"
negative_tier = "fault"
persistent_scenarios = ["restart", "corruption", "timeout", "duplicate", "partial_failure"]
vm_device_scenarios = ["register_configuration", "normal_io", "reset", "interrupt", "malformed_input", "failure"]
boot_evidence = ["vm_or_qemu", "serial"]
passing_state = "passed"
evidence_required_fields = ["test_id", "command", "revision", "host", "started_at", "ended_at", "result_state", "reason"]
evidence_artifact = "evidence.json"

[commands]
deterministic = "./scripts/test-all.sh"
full_validation = "SYNOS_FULL_VALIDATION=1 ./scripts/full-validation.sh"

# Crates with production targets but no local #[cfg(test)] module or tests/
# target. Each exception must name the replacement integration evidence.
[[crate]]
name = "synos-uefi"
reason = "The UEFI loader is firmware-targeted and cannot link into the host test harness."
replacement_integration = "integration.02.boot-storage"

[[crate]]
name = "synos-balancerd"
reason = "The coordinator is exercised through cluster and actor integration boundaries."
replacement_integration = "integration.40.cluster-balancing"

[[crate]]
name = "synos-init"
reason = "The Ring 3 init entry point is target startup glue and is exercised by boot integration."
replacement_integration = "integration.01.core"

[[crate]]
name = "synos-legacy-pc-drivers"
reason = "Hardware driver entry points require the VM and platform qualification harness."
replacement_integration = "integration.02.boot-storage"

[[crate]]
name = "synos-platform-io"
reason = "Platform I/O is selected by target adapters and exercised by compatibility integration."
replacement_integration = "integration.03.compatibility"

[[crate]]
name = "synos-power"
reason = "ACPI and thermal paths require platform lifecycle integration fixtures."
replacement_integration = "integration.19.lifecycle"

[[crate]]
name = "synos-auditd"
reason = "The audit daemon is tested through the authenticated audit pipeline."
replacement_integration = "integration.36.package-audit"

[[crate]]
name = "synos-inspect"
reason = "Inspection output is a client-facing surface tested through shell and monitor integration."
replacement_integration = "integration.32.inspect-api"

[[crate]]
name = "synos-kvd"
reason = "The cache service is exercised through its bounded client API integration."
replacement_integration = "integration.49.cache-api"

[[crate]]
name = "synos-system-model"
reason = "The model is a shared declaration surface exercised by runtime integration."
replacement_integration = "integration.57.config-activation"

[[crate]]
name = "cargo-synos"
reason = "The Cargo subcommand is a thin host CLI wrapper tested through toolchain integration."
replacement_integration = "integration.12.toolchain-runtime"

[[crate]]
name = "synos-compiler"
reason = "The compiler driver is exercised through the toolchain integration boundary."
replacement_integration = "integration.12.toolchain-runtime"

[[crate]]
name = "synos-durability"
reason = "Durability primitives are exercised by the backup and restore integration boundary."
replacement_integration = "integration.18.backup-restore"

[[crate]]
name = "synos-hello-world"
reason = "The example package is a cross-target build fixture, not a host test target."
replacement_integration = "integration.12.toolchain-runtime"

