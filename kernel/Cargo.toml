[package]
name = "synos-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "synos-kernel"
path = "src/main.rs"

[dependencies]
synos-boot-protocol = { path = "../crates/boot-protocol" }
synos-fabric = { path = "../crates/fabric" }
synos-status = { path = "../crates/status" }
