[package]
name = "synos-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[[bench]]
name = "lock_contention"
harness = false

[[bench]]
name = "hot_allocator"
harness = false

[[bench]]
name = "scalability"
harness = false

[[bin]]
name = "synos-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
synos-abi = { path = "../crates/abi" }
synos-app = { path = "../crates/app" }
synos-boot-protocol = { path = "../crates/boot-protocol" }
synos-fabric = { path = "../crates/fabric" }
synos-fsd = { path = "../crates/fsd" }
synos-legacy-pc-drivers = { path = "../crates/legacy-pc-drivers" }
synos-ipc = { path = "../crates/ipc" }
synos-init = { path = "../crates/init" }
synos-observability = { path = "../crates/observability" }
synos-numa = { path = "../crates/numa" }
synos-power = { path = "../crates/power" }
syn-shell = { path = "../crates/syn-shell" }
synos-status = { path = "../crates/status" }
synos-runtime = { path = "../crates/runtime" }
synos-synfs = { path = "../crates/synfs" }
synos-system-model = { path = "../crates/system-model" }

[dev-dependencies]
synos-test-support = { path = "../crates/test-support" }
