services:
  ghostos:
    build: .
    image: ghostos:latest
    container_name: ghostos
    ports:
      - "5900:5900"
    environment:
      - GHOSTOS_QEMU_ACCEL=tcg
      - GHOSTOS_GUEST_MEMORY=512M
    stdin_open: true
    tty: true
    # Override the default command to use single-node mode.
    command: [ "single" ]

  ghostos-cluster:
    build: .
    image: ghostos:latest
    container_name: ghostos-cluster
    ports:
      - "5900-5907:5900-5907"
    environment:
      - GHOSTOS_QEMU_ACCEL=tcg
      - GHOSTOS_GUEST_MEMORY=512M
      - GHOSTOS_CLUSTER_NODES=3
    stdin_open: true
    tty: true
    profiles:
      - cluster
    command: [ "cluster" ]