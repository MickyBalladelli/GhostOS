name: SynOS scheduled validation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SYNOS_FULL_VALIDATION: '1'

jobs:
  coverage:
    name: Per-crate coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: ./scripts/coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: build/coverage

  mutation:
    name: Mutation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-mutants
      - run: SYNOS_MUTATION_PACKAGE=synos-status ./scripts/mutation.sh

  fuzz:
    name: Nightly fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-fuzz
      - run: SYNOS_FUZZ_RUNS=10000 ./scripts/fuzz-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-corpus-and-crashes
          path: |
            fuzz/corpus
            fuzz/artifacts

  model-and-sanitizer:
    name: Miri, race, sanitizer, and cross-target checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: i686-unknown-linux-gnu,powerpc64-unknown-linux-gnu
          components: miri
      - run: cargo miri setup
      - run: cargo miri test -p synos-status
      - run: cargo check -p synos-status --target i686-unknown-linux-gnu
      - run: cargo check -p synos-status --target powerpc64-unknown-linux-gnu
      - run: RUSTFLAGS='-Zsanitizer=address' cargo +nightly test -p synos-status

  race-and-panic:
    name: Race, model, and panic-abort validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: RUSTFLAGS='-Zsanitizer=thread' cargo +nightly test -p synos-status
      - run: |
          if rg -q 'loom|model-check' Cargo.toml crates kernel virtual_machine; then
            cargo +nightly test --workspace --all-targets
          else
            echo 'loom/model tier skipped: no loom/model harness is registered'
          fi
      - run: rg -q 'panic = "abort"' Cargo.toml
      - run: cargo build -p synos-kernel --release

  reproducibility:
    name: Reproducible boot image and release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: ./scripts/check-reproducible-image.sh
      - run: python3 scripts/validate-test-inventory.py
