name: VM quality gates

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  deterministic:
    name: Deterministic VM tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate VM quality contract
        run: python scripts/validate-vm-quality.py --changed
      - name: Run root deterministic tests
        run: cargo test
      - name: Run VM all-target tests
        run: cargo test -p synos-vm --all-targets

  workspace:
    name: Workspace quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run deterministic evidence runner
        run: ./scripts/test-all.sh
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-deterministic-evidence
          path: build/test-evidence
