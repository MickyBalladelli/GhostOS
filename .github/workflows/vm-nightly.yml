name: VM nightly validation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SYNOS_FULL_VALIDATION: '1'

jobs:
  fuzz:
    name: VM decoder, device, and image fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Run bounded VM fuzz smoke
        run: SYNOS_FUZZ_RUNS=1000 ./scripts/fuzz-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-fuzz-corpus
          path: |
            fuzz/corpus
            fuzz/artifacts

  full-validation:
    name: VM full validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Run full validation
        run: ./scripts/full-validation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-full-validation-evidence
          path: build/test-evidence
